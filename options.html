<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowVoc Settings</title>
  <link rel="stylesheet" href="review.css">
  <style>
    body { width: auto; min-height: 100vh; background: #f9fafb; }
    .app { max-width: 720px; margin: 0 auto; padding: 32px 18px; }
    .panel { background:#fff; border:1px solid #e5e7eb; border-radius:22px; padding:18px; box-shadow:0 12px 40px rgba(17,24,39,.07); }
    .field { margin-top:14px; }
    label { display:block; font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:#6b7280; margin-bottom:6px; }
    input, select { width:100%; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .status { margin-top:12px; font-size:13px; color:#374151; }
    .status.error { color:#991b1b; }
    .status.ok { color:#065f46; }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">FlowVoc AI</p>
        <h1>Settings</h1>
        <p class="muted">Connect the extension to your local LM Studio server.</p>
      </div>
    </header>

    <section class="panel">
      <div class="field">
        <label for="endpoint">Local LLM endpoint</label>
        <input id="endpoint" type="url" placeholder="http://127.0.0.1:1234/v1/chat/completions">
      </div>

      <div class="field">
        <label for="model">Model name</label>
        <input id="model" type="text" placeholder="google/gemma-4-e4b">
      </div>

      <div class="row">
        <div class="field">
          <label for="temperature">Temperature</label>
          <input id="temperature" type="number" min="0" max="1" step="0.1">
        </div>
        <div class="field">
          <label for="maxTokens">Max tokens</label>
          <input id="maxTokens" type="number" min="150" max="1500" step="50">
        </div>
      </div>

      <div class="field">
        <label for="sinhalaStyle">Sinhala style</label>
        <select id="sinhalaStyle">
          <option value="simple">Simple Sinhala</option>
          <option value="detailed">Detailed Sinhala</option>
        </select>
      </div>

      <div class="footer-actions">
        <button id="saveBtn">Save settings</button>
        <button id="testBtn" class="ghost">Test local LLM</button>
        <button id="reviewBtn" class="ghost">Open review</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
